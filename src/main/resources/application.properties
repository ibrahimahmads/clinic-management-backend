spring.application.name=clinic-management-system
spring.devtools.restart.enabled=false
server.port=8080

# mendefine driver database (postgres)
spring.datasource.driver-class-name=org.postgresql.Driver

# untuk mengarahkan url ke db yang digunakan
spring.datasource.url=jdbc:postgresql://localhost:5432/clinic_management_db

# untuk define username
spring.datasource.username=postgres

# untuk define password
spring.datasource.password=dynabook

# define hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# menitranslate Capital letter to _
# spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy

# show query
spring.jpa.show-sql=true

# auto generate table
spring.jpa.hibernate.ddl-auto=update

